name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build and lint
        run: bash scripts/build-debug-apk.sh

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: vs-launcher-debug-apk
          path: dist/VS-Launcher-*-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate local device helpers
        run: |
          bash -n scripts/infinix-adb-smoke.sh
          bash -n scripts/infinix-freezer-session.sh
          bash -n scripts/infinix-codex-retry.sh
          bash -n scripts/infinix-manual-profile.sh
          bash -n scripts/infinix-manual-ab.sh
          python3 -m py_compile scripts/analyze-startup.py
          python3 -m py_compile scripts/check-ui-contract.py
          bash -n scripts/check-apk-size.sh
          python3 scripts/check-ui-contract.py

          cat > /tmp/startup-a.csv <<'EOF'
          iteration,total_time_ms,wait_time_ms,launch_state,status,timestamp
          1,120,123,COLD,ok,2026-09-20T00:00:00+00:00
          2,110,114,COLD,ok,2026-09-20T00:00:01+00:00
          3,130,134,COLD,ok,2026-09-20T00:00:02+00:00
          EOF

          cat > /tmp/startup-b.csv <<'EOF'
          iteration,total_time_ms,wait_time_ms,launch_state,status,timestamp
          1,90,93,COLD,ok,2026-09-20T00:00:00+00:00
          2,100,103,COLD,ok,2026-09-20T00:00:01+00:00
          3,95,98,COLD,ok,2026-09-20T00:00:02+00:00
          EOF

          python3 scripts/analyze-startup.py             /tmp/startup-a.csv /tmp/startup-b.csv             --output /tmp/startup-comparison.md
          grep -q 'Median TotalTime' /tmp/startup-comparison.md

      - name: JVM UI and search tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build and lint
        run: bash scripts/build-debug-apk.sh

      - name: Check APK size budget
        run: bash scripts/check-apk-size.sh

      - name: Compile performance test APKs
        run: |
          gradle --no-daemon :macrobenchmark:assembleBenchmark
          gradle --no-daemon :app:assembleBaselineProfile :macrobenchmark:assembleBaselineProfile

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: vs-launcher-debug-apk
          path: dist/VS-Launcher-*-debug.apk
          if-no-files-found: error
          retention-days: 14
